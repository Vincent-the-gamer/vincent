        <link

            href="/node_modules/aplayer/dist/APlayer.min.css"
        />
        <title>诡锋 Vincent</title>
        <script>
            (function () {
                const prefersDark =
                    window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches;
                const setting =
                    localStorage.getItem("vueuse-color-scheme") || "auto";
                if (setting === "dark" || (prefersDark && setting !== "light"))
                    document.documentElement.classList.toggle("dark", true);
            })();
        </script>
        <!-- 看板娘 -->
        <script src="/live2d/autoload.js"></script>
    </head>

    <body class="font-sans text-gray-700 dark:text-gray-200 relative">

        <!-- 播放器 -->
        <div id="aplayer"></div>
        <script type="module" src="/src/main.ts"></script>

            import APlayer from "aplayer";
            // 无法SSR
            const ap = new APlayer({
                container: document.getElementById("aplayer"),
                fixed: true,
                audio: [
                    {
                        name: "Still Kids(feat. Yosie)",

                    },

                        cover: "/music/cover/the-baddest-cover.jpeg",
                    },
                    {
                        name: "恋ひ恋ふ縁",
                        artist: "Famishin,KOTOKO",
                        url: "/music/恋ひ恋ふ縁.mp3",

                    {
